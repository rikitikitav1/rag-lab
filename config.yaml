llm:
  # what we expect OLLAMA_CONTEXT_LENGTH to be; the server is the authority
  context_length: 8192
  base_url: http://ollama:11434
  # in the order the pipeline uses them
  roles:
    # index time
    embedding:    { model: bge-m3 }
    # 8b: gemma3 reports no tool calling in ollama, so the agent path refuses every question
    generation:   { model: llama3.1:8b, options: { max_tokens: 1024, temperature: 0.1 } }
    # evaluation
    judging:      { model: qwen2.5:7b,  options: { max_tokens: 1024, temperature: 0, seed: 0 } }
    # building the question sets
    paraphrasing: { model: gemma2:9b,   options: { max_tokens: 512, temperature: 0.3 } }
  candidates: []

postgres:
  host: postgresql
  port: 5432
  dbname: postgres
  user: postgres

mcp_integrations:
  secret_env:
    - HF_TOKEN
    - CONTEXT7_API_KEY
