# The thresholds below were measured on THIS corpus and do not survive a re-index:
# the embeddings change and the distance distributions with them. See docs/experiments/.
service:
  retrieval:
    # hybrid search cutoff; on our sets it almost always returns something,
    # which is why an "empty retrieval" rule never fires on its own (measured 24.08)
    distance_threshold: 0.55
    results_limit: 5
    limit_vector: 20
    limit_keywords: 20
    rrf_k: 60
    # AND over every lexeme is a precision filter: OR costs 0.15-0.23 MRR on paraphrases,
    # and loses on every set once the search is really exact (measured 26.08)
    keyword_query: and
    keyword_rank: ts_rank
    keyword_norm: 0
    # ask each text-search config whether it recognises the question's own function words, fall
    # back to the alphabet share when none show up. No library, no LLM, scales to any config
    # Postgres ships. Chosen for correctness, not ranking: identical to the fourth decimal on all
    # three sets (datasets/measurements/query_lang/), and it decides the one question the alphabet
    # rule gets wrong. Also picks the language the answer comes back in (26.08)
    query_lang: function_words
    # 200, and the number is the smaller half of what is written here.
    #
    # Where the planner abandons the index is a property of the WHOLE table, not of the
    # variant being searched: the alternative to the hnsw walk is a sequential read of
    # data_chunks filtered by variant, so rows of every other variant pay into its cost.
    # Indexing prefix_1024 moved the crossover from ~197 (25177 rows, two variants) to
    # ~265 (42668 rows, three), which is why the previous note here, and the rule of
    # thumb it rested on, said the opposite of what EXPLAIN says today. There is no rule
    # of thumb: the crossover is nonlinear in rows and moves with random_page_cost.
    # Ask the plan, never a formula, and never inherit an answer from another day.
    #
    # Measured 28.08 with three variants in the table. Plan: index at 100 and 200 on all
    # three, exact sort at 400. Through the index at 200: recall@20 against exact 1.0 on
    # clean_1024, 0.9912 on baseline, 0.9852 on prefix_1024; paired section MRR against
    # exact 0.0000 [0, 0] and zero questions lost, against one lost at 100. Cost, in wall
    # clock rather than planner units: the vector leg reads 1.75 ms at 100 and 2.15 ms at
    # 200 (medians over 100 questions), which is inside the spread, and 45.31 ms at 400
    # because that rung is the sort. The whole hybrid query reads 23-25 ms at both 100 and
    # 200. So the depth is free here and the deeper rung is the one that loses nothing.
    #
    # The fragility is real and measurable: 200 sits about 65 units of ef inside the
    # index zone today, and dropping a variant would put it outside. That is what the
    # depth audit guards; the number alone cannot.
    # auto: the deepest rung of the ladder whose plan still walks the index, asked of the
    # planner and re-asked when the table's page count or row estimate moves. Pages are
    # the load-bearing half: the alternative to the walk is a sequential read priced per
    # page, so a DELETE moves the crossover not at all and a table rewrite moves it a lot. A number here pins it
    # instead, and so does `ef_search` on a request, a run or a comparison axis. What a
    # run actually used is in its snapshot, never inferred from this file
    ef_search: auto
    # left as it was taken: rungs above the crossover are exact search, and a denser
    # ladder under it is a measurement to run deliberately, not a default to drift into
    ef_ladder: [100, 200, 400]
    # recall@20 stays as a diagnostic, not as the gate: it counts neighbours the graph
    # failed to find, and a neighbour lost at rank 18 costs the answer nothing. What the
    # depth is judged by is what it costs the metric we are paid for, measured on the same
    # questions, paired, with an interval. The gate is the worst end of that interval
    recall_gate: 0.98
    # порог не ставится рукой ниже того, что набор умеет различать: полуширина интервала на
    # 823 вопросах около 0.0036, поэтому 0.005 сработал бы как монетка у порога
    max_mrr_loss: 0.01
    # средняя прячет катастрофу на одном вопросе: на clean_1024 два вопроса, где точный
    # поиск давал правильный раздел ПЕРВЫМ, при индексе выпали из топ-20 целиком, а дельта
    # осталась -0.0014 с интервалом через ноль. Это отдельные ворота, и они жёсткие
    max_questions_lost: 0
    # the preflight smoke test, not a gate: enough questions to catch an empty or
    # half-built index, and the floor is low so nobody mistakes it for the gate above
    index_alive_recall: 0.9
    index_alive_questions: 40
  rerank:
    # off by default, and the decision has a history worth keeping. In July it was off
    # because of latency. On 27.08 it went on for runs on the strength of the control
    # hundred, and then the big sets arrived and disagreed with each other:
    #
    #   paraphrased_v2_ru, 823   rerank on baseline  +0.0369 [+0.0155, +0.0596]
    #   paraphrased_v2,    820   rerank on baseline  -0.0245 [-0.0460, -0.0021]
    #
    # It helps the cross-lingual set and hurts the same-language one, both with intervals
    # clear of zero, so a default set on either half would be set on the half that agrees.
    # It also may not be about language at all: an english question lights the keyword leg
    # and a russian one does not, so reranking may be replacing a fusion of two signals
    # with one. Until that is measured, a run asks for it (`rerank: true`) rather than
    # getting it. Cost, measured through the path production calls and written down in
    # datasets/measurements/rerank_latency.json: 2.76 s per question on cpu against 86 ms
    # on an idle card, twenty candidates of average length. On a card a run already owns
    # the same work reads about twice as slow, which is the other half of why an
    # interactive answer does not do it
    enabled: false
    model: BAAI/bge-reranker-v2-m3
    candidates: 20
    top: 5
  agent:
    max_hops: 4
    fallback_policy: corpus_first
    # how many top hits the coverage gate scores with the cross-encoder
    gate_candidates: 5
    # cross-encoder coverage gate: median 0.916 in-corpus against 0.022 outside (measured 24.08)
    weak_threshold: 0.5
    # which signal decides that retrieval is weak; picked by A/B, not by taste (measured 25.08)
    gate_signal: distance
    # threshold for the distance signal, tuned to the same flag budget as the cross-encoder (22 of 100)
    weak_distance: 0.39
    # topic axis, not coverage: null disables it. Distance to the nearest chunk, same scale as
    # weak_distance. At 0.50 (measured 25.08) it turns 11 refusals per 100 off-domain questions
    # into 50, with 0 false refusals per 100 in-corpus paraphrases and 2 per 30 hand-written ones
    topic_threshold: 0.50
  ingestion:
    batch_size: 100
    commit_size: 1000
    chunk_max_size: 1024
  corpus:
    description: >-
      the technical knowledge corpus (interview banks, system-design-primer, redis docs)
    variant: baseline
    variants:
      # every key here is read by the code, and `header_prefix` is derived from `chunker`
      # rather than declared: two keys deciding one thing is how they came to disagree
      baseline:
        chunker: legacy
        max_chunk_size: 1024
      # point zero of the ceiling grid: same size cut, but the prefix comes from the
      # declared root, frontmatter is parsed and the junk is gone. Isolates hygiene of
      # the sources from the change of splitter that comes after it
      clean_1024:
        chunker: rooted
        max_chunk_size: 1024
        # what the ceiling counts. This point was cut and measured with it spent on the
        # body alone, so it says so out loud instead of inheriting a default that moves
        ceiling_on: body
      # the same rules as clean_1024 and one more level of cutting: a section is split by
      # its subheadings before it is split by size. Isolates the splitter from the hygiene
      prefix_1024:
        chunker: structured
        max_chunk_size: 1024
        # same as clean_1024 on purpose: the pair differs by splitter, and a different
        # budget for the body would make it differ by two things at once
        ceiling_on: body
  ingest_quality:
    # what makes a source broken, in shares of its chunks. Turned by hand, printed in
    # every report, so a verdict from last month says which gates it stood on
    # strawman, argue with the numbers: they decide what "a clean source" means.
    # prefix_broken used to sit here and was removed rather than repaired: it compared the
    # rendered prefix against the same root string the prefix was rendered from, so it
    # read 0.0 on every source of every variant and carried 25 of the weight for free
    # hard means the cut is broken, soft means it is dirty and a human should look
    # пороги поставлены от измеренного по 177 источникам, а не от круглых чисел. В скобках
    # то, что читается сегодня, чтобы было видно, где запас, а где ворота реально близко
    hard_gates:
      section_coverage: { min: 0.4 }   # сегодня минимум по источникам 0.58, среднее 0.99
      prefix_dominates: { max: 0.05 }  # сегодня 0.008
    soft_gates:
      dup_in_file: { max: 0.1 }
      dup_in_source: { max: 0.15 }     # сегодня от 0.001 до 0.246, primer выходит грязным
      boilerplate: { max: 0.1 }
      tiny: { max: 0.15 }              # сегодня от 0.03 до 0.07
    # the score sorts variants of one source; it never decides the verdict
    weights:
      section_coverage: 40
      prefix_dominates: 15
      dup_in_source: 10
      tiny: 10
    history_per_variant: 20
    score_formula: v1

  fts:
    languages: { en: english, ru: russian }
    fallback: english
  repos_dir: /repos
  prompts_dir: prompts
  sources:
