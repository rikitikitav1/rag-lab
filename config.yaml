# a measured number carries a `# tuned: file=` line, and the preflight compares them
# a role's options are its default sampler, a model row's options override them, and the stamp says what went out
retrieval:
  # above the farthest nearest chunk of 1643 bank questions on clean_big_1024 (en 0.557), so no pool comes back empty
  # tuned: file=datasets/measurements/threshold_calibration_clean_big_1024_20261002.json
  distance_threshold: 0.56      # cosine distance, 0 to 2
  # this is `k`, what the context guard multiplies: level with k=10 on every axis at half the chunks
  # tuned: file=docs/experiments/2026-07-28_k-sweep-re-judged-with-a.md
  # tuned: file=docs/experiments/2026-07-28_paired-significance-testing-lands-in-the.md
  results_limit: 5
  # not measured: no run has moved either leg's depth
  limit_vector: 20              # candidates the vector leg hands to the fusion
  # not measured: the same as the vector leg
  limit_keywords: 20            # the same for the text leg
  # not measured: the constant of the paper that introduced RRF, and every run here used it
  rrf_k: 60
  # not measured: off until its own A/B; on, a text one source holds under several files takes one place
  collapse_copies_in_source: false
  # AND over every lexeme: OR costs 0.15-0.23 MRR on paraphrases
  # tuned: file=datasets/measurements/2026-08-26_keyword_switch_grid.txt
  keyword:                      # named as a run's record names them
    query: and
    # rank and norm not measured: the grid above moved only the query
    rank: ts_rank
    norm: 0
    # ask each text-search config about the question's own function words, else the alphabet
    query_lang: function_words
  # pinned, not auto: auto is a property of the variant, and preflight refuses a stale pin
  # tuned: file=datasets/measurements/index_cost_clean_1024.json
  # tuned: file=datasets/measurements/recall_ladder_clean_1024.json
  ef_search: 100
  # not measured: off until recall@10 against exact is read on three filters; sources or a version scan strictly anyway
  filtered_scan: "off"
rerank:
  # off: worth +0.0454 of section MRR, and the 8b the agent needs takes its card room
  # tuned: file=docs/experiments/2026-08-30_the-ceiling-that-changed-nothing.md
  enabled: false
  # not measured: the pool the cross-encoder reorders, and every reranking record ran at 20
  candidates: 20
agent:
  # not measured as a choice: a ceiling, and where hops were read the agent took about two
  max_hops: 4
  # the policy that stayed the default after its A/B against the fallback
  # tuned: file=docs/experiments/2026-08-24_corpus-first-and-the-fallback-that-never.md
  fallback_policy: corpus_first
  gate:
    # which signal decides that retrieval is weak, picked by A/B rather than by taste
    # tuned: file=docs/experiments/2026-08-25_a-cheaper-gate-signal-and-a.md
    signal: distance
    # one value for two languages, the larger (ru 0.3861, en 0.3538), so its 22-of-100 budget holds on neither
    # tuned: file=datasets/measurements/threshold_calibration_clean_big_1024_20261002.json
    weak_distance: 0.3861         # cosine distance
    # both read at `signal: cross_encoder` and `either`; under `distance` they sit unused
    candidates: 5
    # cross-encoder coverage gate: median 0.916 in-corpus against 0.022 outside
    # tuned: file=docs/experiments/2026-08-24_corpus-first-and-the-fallback-that-never.md
    weak_threshold: 0.5
  # per language: an off-domain english question sits closer to an english corpus. 1% budget
  # tuned: file=datasets/measurements/threshold_calibration_clean_big_1024_20261002.json
  topic_threshold:              # cosine distance
    ru: 0.4707
    en: 0.4287
ingestion:
  # not measured: sizes of an embedder call and of a transaction, which move speed and not the index
  batch_size: 100               # chunks per embedder call
  commit_size: 1000             # rows per commit
corpus:
  description: >-
    the technical knowledge corpus (interview banks, books, documentation repositories and sites, man pages)
  # the big corpus under the ceiling grid's winner, measured before the switch
  # tuned: file=docs/experiments/2026-10-03_finding-the-right-page-in-a-corpus-ten-times-larger.md
  variant: clean_big_1024
  variants:
    # every key here is read by the code
    clean_1024:
      chunker: rooted
      max_chunk_size: 1024      # characters
      # what the ceiling counts, said out loud rather than inherited from a default
      ceiling_on: body
    # the big corpus cut by clean_1024's policy; clean_1024 stays declared for the tests that read its policy
    clean_big_1024:
      chunker: rooted
      max_chunk_size: 1024      # characters
      ceiling_on: body
      merge_tiny_sections_under: 60   # characters of body; a heading with a line under it is not a chunk alone
    # variants that lost are gone; their policy rides in the entry that measured them

fts:
  # the query side; the index is built by the schema's trigger, which must name the same configs
  languages: { en: english, ru: russian }
  # not measured: the language most of the corpus is written in
  fallback: english
repos_dir: /repos
prompts_dir: prompts
# the engines a clean database is seeded with; a cloud comes through `POST /v1/engine`
engines:
  - { name: ollama,      kind: ollama, env_prefix: OLLAMA,      placement: gpu }
  - { name: ollama-cpu,  kind: ollama, env_prefix: OLLAMA_CPU,  placement: cpu }
  - { name: vllm,        kind: vllm,   env_prefix: VLLM,        placement: gpu }
  - { name: vllm-cpu,    kind: vllm,   env_prefix: VLLM_CPU,    placement: cpu }
  - { name: vllm-embed,  kind: vllm,   env_prefix: VLLM_EMBED,  placement: gpu }
  - { name: vllm-rerank, kind: vllm,   env_prefix: VLLM_RERANK, placement: gpu }
  # one engine a converter tool: a text-layer PDF and a page go to Docling, a scan to MinerU
  - { name: converter-docling, kind: converter, env_prefix: CONVERTER_DOCLING, placement: gpu }
  - { name: converter-mineru,  kind: converter, env_prefix: CONVERTER_MINERU,  placement: gpu }
  # cloud brokers: the address and the key come from the env by the prefix, never from this file
  - { name: gonka,      kind: openai_compatible, env_prefix: GONKA,      placement: remote, balance_reader: gonka_key }
  - { name: neuraldeep, kind: openai_compatible, env_prefix: NEURALDEEP, placement: remote }
  - { name: groq,       kind: openai_compatible, env_prefix: GROQ,       placement: remote }
llm:
  # what we expect OLLAMA_CONTEXT_LENGTH to be; the server is the authority
  context_length: 8192          # tokens
  # held in every ollama model a role uses: its OpenAI door drops a penalty per call, and a pull resets the model
  repetition_penalty: 1.1
  base_url: http://ollama:11434
  # against qwen2.5's own tokenizer on live rows and docs, cl100k reads Latin as long and Cyrillic up to 1.6 times longer
  token_estimate: { latin_divisor: 1.02, cyrillic_extra: 0.65 }
  # the penalty a server applies where the model names none, measured byte for byte; another version is unknown
  measured_repeat_penalty: { "0.32.0": 1.1 }

postgres:
  host: postgresql
  port: 5432
  dbname: postgres
  user: postgres

mcp_integrations:
  secret_env:
    - HF_TOKEN
    - CONTEXT7_API_KEY
