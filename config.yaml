# a measured number carries a `# tuned: file=` line, and the preflight compares them
service:
  retrieval:
    # 0.55 cuts the hybrid pool and never empties it over 1643 questions; 0.39 weak, 0.44 off-topic
    # tuned: file=datasets/measurements/threshold_calibration_20260830.json
    distance_threshold: 0.55
    # this is `k`: how many chunks the generator sees, and what the context guard multiplies
    results_limit: 5
    limit_vector: 20
    limit_keywords: 20
    rrf_k: 60
    # AND over every lexeme: OR costs 0.15-0.23 MRR on paraphrases
    # tuned: file=datasets/measurements/2026-08-26_keyword_switch_grid.txt
    keyword_query: and
    keyword_rank: ts_rank
    keyword_norm: 0
    # ask each text-search config about the question's own function words, else the alphabet
    query_lang: function_words
    # pinned, not auto: auto is a property of the variant, and preflight refuses a stale pin
    # tuned: file=datasets/measurements/index_cost_clean_1024.json
    # tuned: file=datasets/measurements/recall_ladder_clean_1024.json
    ef_search: 100
    # a red preflight at 100 is an order to measure the lower rungs, not to invent a number
    ef_ladder: [100, 200, 400]
    # recall is a diagnostic; the gate on the depth is max_mrr_loss, on the same questions
    recall_gate: 0.98
    # not set below what the set can resolve: half-width 0.0088 by section on 823
    max_mrr_loss: 0.01
    # a mean hides a catastrophe on one question, so the gate counts questions lost
    max_questions_lost: 0
    # a smoke test, not the gate: enough to catch an empty or half-built index
    index_alive_recall: 0.9
    index_alive_questions: 40
    # the sets a verdict is read on, named once for the preflight and the report
    criterion_sets: [paraphrased_v2_ru, paraphrased_v2]
    # the winner on the criterion must not lose here; it vetoes, it never chooses
    veto_sets: [veto_v1]
  rerank:
    # off: worth +0.0454 of section MRR, and the 8b the agent needs takes its card room
    # tuned: file=docs/experiments/2026-08-30_the-ceiling-that-changed-nothing.md
    enabled: false
    model: BAAI/bge-reranker-v2-m3
    candidates: 20
  agent:
    max_hops: 4
    fallback_policy: corpus_first
    # both read only at `gate_signal: cross_encoder`; under `distance` they sit unused
    gate_candidates: 5
    # cross-encoder coverage gate: median 0.916 in-corpus against 0.022 outside
    # tuned: file=docs/experiments/2026-08-24_corpus-first-and-the-fallback-that-never.md
    weak_threshold: 0.5

    # which signal decides that retrieval is weak, picked by A/B rather than by taste
    # tuned: file=docs/experiments/2026-08-25_a-cheaper-gate-signal-and-a.md
    gate_signal: distance
    # one value for two languages (ru 0.3957, en 0.3653), so its 22-of-100 budget holds on neither
    # tuned: file=datasets/measurements/threshold_calibration_20260830.json
    weak_distance: 0.39
    # per language: an off-domain english question sits closer to an english corpus. 1% budget
    # tuned: file=datasets/measurements/threshold_calibration_20260830.json
    topic_threshold:
      ru: 0.4560
      en: 0.4374
  ingestion:
    batch_size: 100
    commit_size: 1000
    # a shadow ceiling: the fallback for a source with no variant policy
    chunk_max_size: 1024
  corpus:
    description: >-
      the technical knowledge corpus (interview banks, system-design-primer, redis docs)
    # the ceiling grid's winner; the three distance thresholds did not move with it
    # tuned: file=docs/experiments/2026-08-30_the-ceiling-that-changed-nothing.md
    variant: clean_1024
    variants:
    # every key here is read by the code; `header_prefix` is derived from `chunker`
      baseline:
        chunker: legacy
        max_chunk_size: 1024
    # point zero of the ceiling grid: hygiene isolated from the change of splitter
      clean_1024:
        chunker: rooted
        max_chunk_size: 1024
        # what the ceiling counts, said out loud rather than inherited from a default
        ceiling_on: body
      # variants that lost are gone; their policy rides in the entry that measured them
  ingest_quality:
    # hard means the cut is broken, soft means dirty; a ceiling abstains below few chunks
    # tuned: file=datasets/measurements/ingest_gate_readings_20260830.json
    hard_gates:
      # a floor, so the abstention above does not apply: missing chunks cannot be counted
      section_coverage: { min: 0.4 }
      # three sources read over it, all three holding two short code answers
      prefix_dominates: { max: 0.05 }
    # tuned: file=datasets/measurements/ingest_gate_readings_20260830.json
    soft_gates:
      dup_in_file: { max: 0.1 }        # max 0.0011, nothing near it
      dup_in_source: { max: 0.15 }     # max 0.1454 (primer), mean 0.0008, nothing breaches
      # the primer breaches and stays breaching: its nine large files do repeat navigation
      boilerplate: { max: 0.1 }
      tiny: { max: 0.15 }              # max 0.0599, mean 0.0046
    # the score sorts variants of one source; it never decides the verdict
    weights:
      section_coverage: 40
      prefix_dominates: 15
      dup_in_source: 10
      tiny: 10
    history_per_variant: 20
    # written into every report, so a score from another formula is not read as this one
    score_formula: v1

  fts:
    # index-time: changing this re-indexes the corpus, it does not re-rank a query
    languages: { en: english, ru: russian }
    fallback: english
  repos_dir: /repos
  prompts_dir: prompts
  # data, not settings: 173 repository names that nothing else reads
  sources:
    interview:
      base_url: https://github.com/Devinterview-io
      language: eng
