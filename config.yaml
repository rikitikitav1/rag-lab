llm:
  base_url: http://ollama:11434
  roles:
    generation:   { model: llama3.1:8b, options: { max_tokens: 1024, temperature: 0.1 } }
    embedding:    { model: bge-m3,      options: { num_ctx: 2048 } }
    judging:      { model: qwen2.5:7b,  options: { max_tokens: 1024, temperature: 0 } }
    paraphrasing: { model: gemma2:9b,   options: { max_tokens: 512, temperature: 0.3 } }
  candidates: []

postgres:
  host: postgresql
  port: 5432
  dbname: postgres
  user: postgres
