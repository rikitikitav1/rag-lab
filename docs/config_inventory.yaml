# verdicts of the config inventory: one row a key of the tree, joined by scripts/config_inventory.py
# class: setting (the record carries it or preflight compares it), code (changes the meaning of a stored row),
# cap (an operational limit), seed (the config seeds it, the database owns it); move: yes when code holds a setting; family: an id under `families`, one value held in more than one place
families:
  rrf_k: 'the RRF constant: the search fuses its legs with `retrieval.rrf_k`, the experiment and comparison reports fuse arms
    with `evals.retrieval_compare.rrf_k`, on purpose'
  max_hops: 'the hop budget: `agent.max_hops` the value, `MAX_HOPS` the cap a request may name, `_CEILING_BEFORE_ROWS_RECORDED_IT`
    the ceiling old rows ran under, pinned'
  converter_settings: 'which settings file each converter runs: named in `intake.settings`, held by the file under `converters/*/settings/`'
  piece_ceiling: 'the bound on one converter piece: `CHUNK_CEILING` in code, `piece_ceiling_seconds` in a settings file overrides
    it'
  context_length: 'the ollama window: `llm.context_length` in config and `OLLAMA_CONTEXT_LENGTH` in compose, checked by tests/stand/test_no_card_mode.py'
  postgres_host: 'the database host: `postgres.host` in config, `POSTGRES_HOST` in the environment wins (`app/orm/dsn.py`)'
  ollama_url: 'the ollama address: `OLLAMA_BASE_URL` wins, `llm.base_url` is the fallback when compose leaves it empty (`app/engines/core.py`)'
  judge_model: 'the judge model: `llm.roles.judging.model` in config, `VLLM_MODEL` exported by scripts/up.sh, compose falls
    back to a written default'
  slug: the file-name slug pattern, written twice
  heading_reader: 'the markdown heading reader: `sources/base.HEADING` and `ingest.HEADING_LINE`'
  search_depth: 'the depth of a search leg: `retrieval.limit_vector` and `retrieval.limit_keywords` both 20, and the comparison
    report reads `evals.retrieval_compare.depth`, 20 of its own'
