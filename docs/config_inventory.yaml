  retrieval.keyword.translation.model_dir:
    class: setting
  retrieval.keyword.translation.replaces:
    class: setting
    how: off; replacing the question's words read ru 0.849 but Russian books 0.871 to 0.671 (datasets/measurements/arc7_keyword_full.json)
  retrieval.keyword.aliases.enabled:
