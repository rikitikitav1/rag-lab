[project]
 name = "rag-lab"
  version = "0.1.0"
  requires-python = ">=3.12"
  dependencies = [
      "psycopg[binary]",
      "pgvector",
      "requests",
      "fastapi",
      "uvicorn[standard]",
      "python-frontmatter",
      "sqlalchemy",
      "pyyaml>=6.0.3",
      "structlog>=26.1.0",
      "pydantic>=2.13.4",
      "langdetect>=1.0.9",
      "sqlalchemy-utils>=0.42.1",
      "openai>=2.46.0",
      "asyncpg>=0.31.0",
      "python-multipart>=0.0.20",
      "sentence-transformers>=5",
      "transformers>=5",
      "fastmcp>=2.0",
      "scipy>=1.18.0",
]

[dependency-groups]
  dev = ["pytest>=8", "ruff>=0.16"]

[tool.pytest.ini_options]
  testpaths = ["tests"]


[build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"


 [tool.hatch.build.targets.wheel]
  only-include = ["app"]
  sources = ["app"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "pydantic.Field",
]

[tool.bandit]
# raw SQL uses bound params for user data; interpolated parts are code-controlled identifiers
skips = ["B608"]
