[project]
 name = "rag-lab"
  version = "0.1.0"
  requires-python = ">=3.12"
  dependencies = [
      "psycopg[binary]",
      "pgvector",
      "requests",
      "fastapi",
      "uvicorn[standard]",
      "python-frontmatter",
      "sqlalchemy",
      "pyyaml>=6.0.3",
      "structlog>=26.1.0",
      "pydantic>=2.13.4",
      "langdetect>=1.0.9",
      "sqlalchemy-utils>=0.42.1",
      "openai>=2.46.0",
      "asyncpg>=0.31.0",
      "python-multipart>=0.0.20",
      "FlagEmbedding>=1.3.5",
      "transformers>=4.44,<4.49",
]

[dependency-groups]
  dev = ["pytest>=8"]

[tool.pytest.ini_options]
  testpaths = ["tests"]


[build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"


 [tool.hatch.build.targets.wheel]
  only-include = ["app"]
  sources = ["app"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
