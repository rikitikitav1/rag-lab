[project]
 name = "rag-lab"
  version = "0.1.0"
  requires-python = ">=3.12"
  dependencies = [
      "psycopg[binary]",
      "pgvector",
      "requests",
      "fastapi",
      "uvicorn[standard]",
      "python-frontmatter",
      "sqlalchemy",
      "pyyaml>=6.0.3",
      "structlog>=26.1.0",
      "pydantic>=2.13.4",
      "langdetect>=1.0.9",
      "sqlalchemy-utils>=0.42.1",
      "openai>=2.46.0",
      "asyncpg>=0.31.0",
      "python-multipart>=0.0.20",
      "fastmcp>=2.0",
      "scipy>=1.18.0",
      "langgraph>=1.0",
      "langchain>=1.0",
      "langchain-core>=1.0",
      "langchain-ollama>=1.0",
      "langchain-text-splitters>=1.0",
      "pypdf>=6.19.0",
      "pypdfium2>=4.30",
]

[dependency-groups]
  dev = ["pytest>=8", "ruff>=0.16"]
  # community pinned back because 0.4.2 dropped chat_models.vertexai, which ragas imports
  eval = ["ragas==0.4.3", "langchain-community<0.4"]

[tool.pytest.ini_options]
  testpaths = ["tests"]


[build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"


 [tool.hatch.build.targets.wheel]
  only-include = ["app"]
  sources = ["app"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E5 is the width: declared and never selected, so nothing read it and the code drifted past it
select = ["E4", "E5", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
# the `config/` folder of yaml beside the tree is not the `config` module the app imports
known-third-party = ["config"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "pydantic.Field",
]

[tool.bandit]
# raw SQL uses bound params for user data; interpolated parts are code-controlled identifiers
skips = ["B608"]
