# gold for the converter benchmark: a document is published both as its source and as PDF or HTML
# the downloaded files live in files/ beside this manifest and stay out of git
regimes: [text_pdf, raster, html]
# how an output is read against its gold; similarities are rapidfuzz scores from 0 to 100 on folded text
score:
  # WRatio, chosen on the pair set (outline titles against source headings, per document): at 90 every document
  # finds 95.2% or more (postgres 99.8%, at 95 only 83%), 72 of 5401 matches differ from the older number rule
  heading_similarity: 90
  # the point at which a parser is taken as good on a section (owner): its plain text this alike to the gold (ratio)
  recovered_similarity: 98
  # read beside it every time, none chosen after the reading, so the tolerance is set once with all three in hand
  recovered_cuts: [98, 95, 90]
  # a row is doubtful when the two cuts most like its gold are closer than this
  identification_band: 5
  # a cut longer than this many times its gold lost its closing heading: an overrun, out of the means, counted;
  # set in the gap the ru run showed (bounded cuts up to 1.35, overruns from 3.07), moved only with a new reading
  overrun_ratio: 3
  # a tool is chosen when it is no worse on gate share and headings found at any level (levels are a column), and better
  # on one of code contained, cells, body similarity (word F1 read beside it); indistinguishable leaves it to speed
  bar: { no_worse: [gates_cuttable, headings_found], better_on_one: [code_contained, table_cells_found, similarity, body_f1] }
  # reading, not a column: word F1 low with similarity high is lost spaces (glued words), both low is lost text
  # mixed-script words in the gold are the page's own (Greek in formulas); both regimes read the excess over them
languages: [en, ru]
min_documents_per_language_per_regime: 4
# a PDF and its source are one document when this share of the PDF's outline titles is found in the source
pair_threshold: 0.9

# raster pages are sections of the real text-layer PDFs, cropped by the text layer, then degraded
# the rendered files are reproducible from this block and sections.json, so files/raster may be deleted
raster:
  documents: { en: [progit, postgres, python, django], ru: [progit, postgres, latex_baldin, haskell_kholomiev] }
  inputs: [image_pdf, jpeg_pages]
  # jpeg pages test the tool's routing, not its tolerance, so they run at two points only
  jpeg_pages_points: [baseline, scanner]
  # not measured: high enough that the saved page adds no loss of its own on top of the point's degradation
  jpeg_pages_quality: 95
  # Russian first: the Cyrillic OCR model is where the tools part; English only if Russian shows a difference
  language_order: [ru, en]
  sections:
    seed: 20260924
    per_document: 15
    kinds: [prose, code, table]
    # a document short of a kind declares the deficit in the ledger, the other kinds do not fill it
    per_kind: 5
    # how a section and its kind are read from a PDF; a rule that misses reads as a quiet zero, so it lives here
    detect:
      max_toc_level: 3
      max_pages: 5
      code_min_lines: 3
      # a section with a table and code is read as a table: the table is checked first
      kind_priority: [table, code, prose]
      # a figure of boxes and arrows reads as a ruled grid; a table has rows, columns and text in half its cells
      table_min_rows: 2
      table_min_cols: 2
      table_min_filled: 0.5
      # a text block at one height on more than this share of a parity's pages is a running header or footer
      running_block_share: 0.5
      # monospace by glyph widths, no font names: on the drawn pages mono fonts spread 1.00, text fonts 1.38 and up;
      # a document whose fonts fall inside that gap is read by eye, and the value moves only with a new census
      mono_width_spread: 1.05
      # a span with fewer distinct glyphs than this says nothing about its font
      mono_min_distinct: 10
  baseline: { dpi: 300, format: png }
  # one axis at a time; the three steps are expected clean, degraded, broken
  ladder:
    dpi: [200, 150, 100]
    jpeg_quality: [85, 50, 25]
    noise_sigma: [5, 15, 30]
    skew_degrees: [1, 3, 6]
    blur_radius_px: [1, 2, 3]
  composite:
    scanner: { dpi: 200, jpeg_quality: 75, skew_degrees: 1, noise_sigma: 5 }

# small inputs cut from a gold PDF, for a smoke of the converter job; each is an input, not a setting
smoke:
  - { id: progit_ru_p20-27, from: progit/ru/pdf/progit.pdf, pages: [20, 27] }

# a site's page is a source file whole: {path} is the file's path without suffix or index, {title} its own heading
# and {chapter} the heading of the file that includes it, both with spaces as dashes; the page is fetched as served
# main names the element that holds the page's own text (tag.class or tag#id, docbook for the DocBook element),
# read by `prepare`: the arm that feeds a tool the text without the site's navigation around it
# drop names the site's own furniture inside that element (tag~text: the tag holding that text), taken out of the
# input and of a gold made from the page; generated lists patterns of a source file whose page the site builds
# from elsewhere, such a page has no gold in its file and is not drawn
html:
  sections:
    seed: 20260925
    per_document: 15
    kinds: [prose, code, table]
  # a pause between two fetches, so a draw is a reader's pace to the site
  pause_seconds: 1

documents:
  - id: progit
    title: Pro Git, 2nd edition
    # admonition icons are a font glyph whose text lands in the PDF's text layer; the source has no such word
    licence: CC BY-NC-SA 3.0
    en:
      source: { repo: https://github.com/progit/progit2, ref: 2.1.450, format: asciidoc }
      text_pdf: https://github.com/progit/progit2/releases/download/2.1.450/progit.pdf
      html: { page: "https://git-scm.com/book/en/v2/{chapter}-{title}", files: ["book/*/sections/*.asc"], main: "div#main" }
    ru:
      source: { repo: https://github.com/progit/progit2-ru, ref: 2.1.125, format: asciidoc }
      text_pdf: https://github.com/progit/progit2-ru/releases/download/2.1.125/progit.pdf
      html: { page: "https://git-scm.com/book/ru/v2/{chapter}-{title}", files: ["book/*/sections/*.asc"], main: "div#main" }

  - id: postgres
    title: PostgreSQL documentation
    # the page prints "Section 9.4" where the gold has the target's title: body reads lower, the same for every tool
    en:
      licence: PostgreSQL licence
      source: { repo: https://github.com/postgres/postgres, ref: REL_18_6, path: doc/src/sgml, format: docbook_sgml }
      text_pdf: https://www.postgresql.org/files/documentation/pdf/18/postgresql-18-A4.pdf
    ru:
      # Postgres Pro Enterprise translation, its source is not public, so the gold is its own HTML
      licence: personal and non-commercial use only
      source: { html: https://postgrespro.ru/docs/enterprise/18, format: html, main: docbook, drop: ["div.toc", "a.id_link"] }
      text_pdf: https://repo.postgrespro.ru/doc/ent/18.6.1/ru/postgres-A4.pdf

  - id: python
    title: Python documentation
    licence: PSF documentation licence
    en:
      # the published archive is an rc3 build, so the source is pinned to that tag
      source: { repo: https://github.com/python/cpython, ref: v3.14.0rc3, path: Doc, format: rst }
      text_pdf: https://docs.python.org/3/archives/python-3.14-docs-pdf-a4.zip

  - id: django
    title: Django documentation
    licence: BSD-3-Clause
    en:
      source: { repo: https://github.com/django/django, ref: 6.1.1, path: docs, format: rst, suffix: .txt }
      text_pdf: https://media.readthedocs.org/pdf/django/stable/django.pdf

  - id: latex_baldin
    title: Компьютерная типография LaTeX
    licence: CC BY-SA 3.0
    ru:
      # the source was last pushed in 2018, the PDF must be checked to be that same edition
      source: { repo: https://github.com/EvgeniiBaldin/ctex-ru, format: latex, encoding: koi8-r }
      text_pdf: https://www.inp.nsk.su/~baldin/LaTeX/ctex.pdf

  - id: haskell_kholomiev
    title: Учебник по Haskell
    # no derivatives: gold on disk for the benchmark only, never a corpus source
    licence: CC BY-NC-ND 3.0
    ru:
      source: { repo: https://github.com/anton-k/ru-haskell-book, path: pandoc, format: markdown, suffix: .txt }
      text_pdf: http://anton-k.github.io/ru-haskell-book/files/ru-haskell-book.pdf

  - id: fastapi
    title: FastAPI documentation
    licence: MIT
    en:
      # the pages include code from docs_src with {* path *}, so the sparse clone takes that folder too
      source: { repo: https://github.com/fastapi/fastapi, path: docs/en/docs, also: [docs_src], format: markdown }
      html: { page: "https://fastapi.tiangolo.com/{path}/", files: ["**/*.md"], main: "article.md-content__inner",
              drop: ["details~🌐", "details~Other versions and variants", "a.headerlink"], generated: ["^::: "] }
    ru:
      # translated by a model upstream
      source: { repo: https://github.com/fastapi/fastapi, path: docs/ru/docs, also: [docs_src], format: markdown }
      html: { page: "https://fastapi.tiangolo.com/ru/{path}/", files: ["**/*.md"], main: "article.md-content__inner",
              drop: ["details~🌐", "details~Other versions and variants", "a.headerlink"], generated: ["^::: "] }

  - id: kubernetes
    title: Kubernetes documentation
    licence: CC BY 4.0
    en:
      source: { repo: https://github.com/kubernetes/website, path: content/en, format: markdown }
      html: { page: "https://kubernetes.io/{path}/", files: ["docs/**/*.md"], main: "div.td-content",
              drop: ["div.section-index", "div#pre-footer", "div.td-page-meta__lastmod"],
              generated: ["auto-generated from the Go source"] }
    ru:
      source: { repo: https://github.com/kubernetes/website, path: content/ru, format: markdown }
      html: { page: "https://kubernetes.io/ru/{path}/", files: ["docs/**/*.md"], main: "div.td-content",
              drop: ["div.section-index", "div#pre-footer", "div.td-page-meta__lastmod"],
              generated: ["auto-generated from the Go source"] }

  - id: vue
    title: Vue documentation
    licence: CC BY 4.0 except images
    en:
      source: { repo: https://github.com/vuejs/docs, path: src, format: markdown }
      html: { page: "https://vuejs.org/{path}.html", files: ["guide/**/*.md", "api/**/*.md"], main: "div.vt-doc" }
    ru:
      source: { repo: https://github.com/vuejs-translations/docs-ru, path: src, format: markdown }
      html: { page: "https://ru.vuejs.org/{path}.html", files: ["guide/**/*.md", "api/**/*.md"], main: "div.vt-doc" }
