name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      # SAST over our own code, fails on medium+ severity
      - name: bandit (SAST)
        run: uvx bandit -r app/ -ll -c pyproject.toml

      # dependency CVEs, blocking
      - name: pip-audit (dependencies)
        run: |
          uv export --no-hashes --format requirements-txt -o requirements.txt
          uvx pip-audit -r requirements.txt

      # secret scan across the full history
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
