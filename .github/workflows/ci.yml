name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check app/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    # the real-database tests build a throwaway base from db/schema.sql, and without one they were all skipped
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
      - name: pull plantuml
        run: docker pull plantuml/plantuml:1.2026.8
      - name: check the agent graph drawing against the code
        run: |
          uv sync --frozen
          uv run python scripts/graph_to_d2.py --check
      - name: render and check freshness
        run: |
          ./scripts/render_diagrams.sh
          git diff --exit-code -- docs/diagrams/ \
            || { echo "::error::diagrams are stale, run scripts/render_diagrams.sh"; exit 1; }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      # SAST over our own code, fails on medium+ severity
      - name: bandit (SAST)
        run: uvx bandit -r app/ -ll -c pyproject.toml

      # dependency CVEs, blocking
      - name: pip-audit (dependencies)
        run: |
          uv export --no-hashes --format requirements-txt -o requirements.txt
          uvx pip-audit -r requirements.txt

      # secret scan across the full history
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
