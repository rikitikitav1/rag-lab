services:
  rag-lab:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    build:
      dockerfile: Dockerfile
    command:
      ["uvicorn", "server:app",
       "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      RERANK_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ${HOME}/working_docs/notes:/notes:ro
      - repos_data:/repos
      - hf_cache:/root/.cache/huggingface

  postgresql:
    image: pgvector/pgvector:pg17
    # an hnsw build asks for 512m of shared memory and the docker default is 64m
    shm_size: 1gb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pg_data:/var/lib/postgresql/data
  dbmate:
    image: ghcr.io/amacneil/dbmate:2.34.1
    command: ["up"]
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres@postgresql:5432/postgres?sslmode=disable"
      # regenerated on purpose: a live database carries the vector index of every variant
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db

  bootstrap:
    build:
      dockerfile: Dockerfile
    command: ["python", "app/bootstrap.py"]
    restart: "no"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface

  seed:
    build:
      dockerfile: Dockerfile
    command: ["python", "app/seed.py"]
    depends_on:
      dbmate:
        condition: service_completed_successfully
    volumes:
      - .:/app

  worker:
    build:
      dockerfile: Dockerfile
    command: ["python", "app/worker.py"]
    environment:
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      WORKER_QUEUES: ${WORKER_QUEUES:-default,io}
      RERANK_DEVICE: ${WORKER_RERANK_DEVICE:-cuda}
      # read by the judge and capped by the slots ollama was started with
      JUDGE_WIDTH: ${JUDGE_WIDTH:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # without this sentence_transformers asks huggingface whether the weights moved
      HF_HUB_OFFLINE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - repos_data:/repos
      - ${HOME}/working_docs/notes:/notes:ro
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      # pinned: unset, ollama picks slots from free VRAM and two arms differ as instruments
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_KEEP_ALIVE: "-1"
      # the server defaults to 4096 and drops whole messages to fit, reporting the trimmed count
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      # the first start on this machine takes longer than the whole retry budget
      start_period: 120s
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
  repos_data:
  pg_data:
  hf_cache:
