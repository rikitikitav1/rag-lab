# what a run is judged on: read by the preflight and the reports, never by a query
verdict:
  # the sets a verdict is read on, named once for the preflight and the report
  criterion_sets: [paraphrased_v2_ru, paraphrased_v2]
  # the winner on the criterion must not lose here; it vetoes, it never chooses
  veto_sets: [veto_v1]
  search_depth:
    # a red preflight at 100 is an order to measure the lower rungs, not to invent a number
    ef_ladder: [100, 200, 400]
    # recall is a diagnostic; the gate on the depth is max_mrr_loss, on the same questions
    recall_gate: 0.98
    # not set below what the set can resolve: half-width 0.0088 by section on 823
    max_mrr_loss: 0.01
    # a mean hides a catastrophe on one question, so the gate counts questions lost
    max_questions_lost: 0
  # a smoke test, not the gate: enough to catch an empty or half-built index
  index_alive: { recall: 0.9, questions: 40 }
# the instruments' own constants, one holder for what the reports and the veto build read
evals:
  stats:
    bootstrap_n: 10000
    # the family-wise alpha every Holm correction reads, one value for every report
    alpha: 0.05
    seed: 42
  # the pre-registered thresholds, named before the count: moving one is a decision, not a tweak
  judge_correlation:
    # the report's prediction keys spell 0.3 and 0.1 and are pinned: a moved value bumps the report's SCHEMA
    rho_with_overlap: 0.3
    partial_gap: 0.1
    stratum_gap: 0.1
    min_rows: 100
    # what counts as a code-bearing context: `_is_code_only` fired on none of 729
    code_stratum: 0.2
  judge_language:
    # a floor that catches only the gross: the judge's history on these rows sat at 96.4% and 95.6% at least 7
    control_floor: 0.90
    # a regime holds while at most this share of the panel crosses 7 against the reference, on either part
    moves_allowed: 0.10
  veto:
    quotas: { cheatsheets: 80, redis-doc/docs: 80, notes: 80, system-design-primer: 30 }
    # shorter than this and the heading is a label rather than a subject: `Usage`, `101`, `fs`
    min_heading: 12
  grade_curve:
    # the grader's thresholds a curve is read at; none is the arm without a grader
    cuts: [null, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  retrieval_compare:
    # not measured: the pool a comparison ranks from, wide enough that no cutoff reaches its edge
    candidates: 100
    # the depth the report reads, not the search's own leg, though both are 20 today
    depth: 20
    cutoffs: [1, 3, 5, 10]
    # fuses the arms' ranks into the report's one ranking, not the search legs: those read `retrieval.rrf_k`
    rrf_k: 60
