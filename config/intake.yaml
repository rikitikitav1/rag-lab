# how an added source is turned into raw markdown before any cut
intake:
  route:
    # tuned: file=datasets/converter_gold/layer_band.json
    # pages under 50 chars: 1-7 a book, Baldin 12 of 308
    min_layer_chars: 50
    # not measured: a shorter raster run in a text book stays with its neighbours; handovers read 9.8 and 22.6 s (2910, 2911)
    min_raster_run: 3
    # not measured: a page with fewer words gives no share worth reading for the suspect-layer signals
    suspect_min_words: 50
  # tuned: file=datasets/converter_gold/raw_band.json
  # read on the gold's section cuts (Docling vs own layer: f1 0.78-1.0, share 0.68-1.15) and applied to each piece; a piece is longer, so its signals sit tighter
  quality:
    output_share_min: 0.6
    output_share_max: 1.25
    # the ru floor is Docling gluing words on TeX books: without a hand repair of glued words such a book reads dirty
    layer_f1_min: 0.75
    mixed_script_max: 0.02
    # the engines the layer band was read on; the others' layer signals are recorded and not gated
    layer_band_engines: [docling]
    # not measured: over this share of breaching units the raw source is bad; coarse below about five units, read the reasons
    bad_share: 0.2
  # the engine each tool runs on; its supervisor is asked only whether it is up
  engines: { docling: converter-docling, mineru: converter-mineru }
  # each engine's settings file when a run names none; a loop passes its own as options
  settings: { docling: docling/default, mineru: mineru/ocr }
