# a git repository of sheets; no licence file in it, so the text stays out of public records
name: cheatsheets
language: en
licence: none declared
git:
  repo: https://github.com/rstacruz/cheatsheets
  include:
  - '*.md'
# a sheet the site hides is not read; its category and tags label it
skip_when_frontmatter:
  category: Hidden
tags_from_frontmatter:
- category
- tags
skip:
- AGENTS
- CONTRIBUTING
- README
- cask-index
- cheatsheet-styles
- index
- index@2016
- licenses
- make-assets
- social-images
skip_when_hygienic:
  vainglory: items in a mobile MOBA
  ph-food-delivery: delivery phone numbers in Metro Manila
  macos-mouse-acceleration: mouse settings
  sketch: graphics editor
  nocode: a joke repository
  flashlight: spotlight plugins
  frequency-separation-retouching: photo retouching
  inkscape: graphics editor
  figlet: samples of every ascii font, one line of knowledge per screen of drawing
  '*@*': a version in the file name means a dead stack, and the unversioned sheet is next to it
veto_families:
- name: cheatsheets
  prefix: cheatsheets/
