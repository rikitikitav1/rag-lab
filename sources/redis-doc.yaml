# the redis documentation repository
name: redis-doc
language: en
licence: CC BY-SA 4.0
git:
  repo: https://github.com/redis/redis-doc
  include:
  - commands/*.md
  - docs/**/*.md
reader: redis-doc
# a command page is headed by the command in capitals, which no code shape catches
reference_leaf: "^[A-Z][A-Z0-9_]+( [A-Z][A-Z0-9_]+)?$"
veto_families:
- name: redis-doc/docs
  prefix: redis-doc/docs/
categories:
- redis
